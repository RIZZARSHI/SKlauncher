alert.duplicate.window.title=डुप्लीकेट इंस्टेंस चेतावनी
alert.duplicate.label.title=आपके पास पहले से ही चल रहे Minecraft का एक इंस्टेंस है।
alert.duplicate.label.body=यदि आप उसी निर्देशिका में कोई दूसरा इंस्टेंस लॉन्च करते हैं, तो वे आपस में टकरा सकते हैं और आपके सेव को दूषित कर सकते हैं। \nइससे कई समस्याएं हो सकती हैं, सिंगलप्लेयर में या अन्यथा। हम किसी भी गलत चीज के लिए जिम्मेदार नहीं होंगे। \nक्या आप इसके बावजूद Minecraft का दूसरा इंस्टेंस शुरू करना चाहते हैं? \nआप गेम को किसी दूसरी निर्देशिका में लॉन्च करके इस समस्या को हल कर सकते हैं ("इंस्टॉलेशन संपादित करें" बटन देखें)।

alert.downgrade.window.title=असंगत संस्थापन  चेतावनी
